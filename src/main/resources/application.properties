spring.application.name=ii_taller_git_2026

# --- Puerto ---
# POO-09 levanta tres servicios en la misma máquina: Irina 8082, Cecilia 8083 y Sol 8080.
# Se cambia sin tocar el código con la variable de entorno PORT.
server.port=${PORT:8082}

# --- H2 (base de desarrollo, corre dentro del proceso Java) ---
# Base en archivo: ./data/entidades.mv.db. Sobrevive a reinicios; data/ está en .gitignore.
spring.datasource.url=jdbc:h2:file:./data/entidades
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update: Hibernate crea las tablas que falten y agrega columnas nuevas, sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Las entidades se cargan y se guardan dentro de los servicios (@Transactional), no en la vista.
spring.jpa.open-in-view=false

# Consola web de H2 en http://localhost:8082/h2-console (JDBC URL: jdbc:h2:file:./data/entidades, usuario sa, sin clave).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Permite abrir la consola desde fuera de la VM (p. ej. el navegador de Windows).
# Solo para desarrollo: quien llegue al puerto 8082 puede entrar a la base.
spring.h2.console.settings.web-allow-others=true

# --- API externa consultada con WebClient (ObjetoExternoService) ---
restful-api.base-url=https://api.restful-api.dev
# Tiempo máximo de espera por respuesta antes de devolver 502.
restful-api.timeout=5s

# --- OpenAPI / Swagger UI (springdoc) ---
# Especificación OpenAPI en JSON: http://localhost:8082/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
# Interfaz para probar la API desde el navegador: http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
# Operaciones ordenadas por verbo HTTP y tags (controllers) por nombre.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Muestra cuánto tardó cada pedido hecho con "Try it out".
springdoc.swagger-ui.display-request-duration=true
# Los errores se documentan por operación con @ApiResponse; sin esto springdoc
# pegaría todos los códigos de ManejadorErrores (400, 404, 409, 422, 502) a cada endpoint.
springdoc.override-with-generic-response=false

# --- API Minecraft de otro proyecto del taller (FlechazoService usa su regla de disparo) ---
# Swagger de esa API: http://10.40.142.132:8080/swagger-ui/index.html
minecraft-remoto.base-url=${MINECRAFT_REMOTO_URL:http://10.40.142.132:8080}
minecraft-remoto.timeout=${MINECRAFT_REMOTO_TIMEOUT:5s}

# --- Mundo Minecraft de Ceci (PortalService crea entidades allá con POST /entidades) ---
# URL externalizable: se toma de la variable de entorno MUNDO_CECI_URL y, si no está,
# usa http://localhost:8083. También se puede pisar al arrancar:
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments=--mundo-ceci.base-url=http://otra-ip:8083
mundo-ceci.base-url=${MUNDO_CECI_URL:http://localhost:8083}
mundo-ceci.timeout=${MUNDO_CECI_TIMEOUT:5s}
