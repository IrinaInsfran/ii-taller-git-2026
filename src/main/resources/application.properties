spring.application.name=ii_taller_git_2026

# --- H2 (base de desarrollo, corre dentro del proceso Java) ---
# Base en archivo: ./data/entidades.mv.db. Sobrevive a reinicios; data/ esta en .gitignore.
spring.datasource.url=jdbc:h2:file:./data/entidades
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update: Hibernate crea las tablas que falten y agrega columnas nuevas, sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Las entidades se cargan y se guardan dentro de los servicios (@Transactional), no en la vista.
spring.jpa.open-in-view=false

# Consola web de H2 en http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/entidades, usuario sa, sin clave).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Permite abrir la consola desde fuera de la VM (p. ej. el navegador de Windows).
# Solo para desarrollo: quien llegue al puerto 8080 puede entrar a la base.
spring.h2.console.settings.web-allow-others=true
