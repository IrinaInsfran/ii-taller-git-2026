spring.application.name=ii_taller_git_2026

# Los tests usan una base en memoria para no tocar ./data
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Los tests no salen a internet: ObjetoExternoServiceImplTest usa respuestas simuladas.
restful-api.base-url=http://localhost:1
restful-api.timeout=2s
minecraft-remoto.base-url=http://localhost:1
minecraft-remoto.timeout=2s
mundo-ceci.base-url=http://localhost:1
mundo-ceci.timeout=2s
